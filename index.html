<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouAndMe</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --surface3: #252525;
    --border: #2a2a2a;
    --accent: #7c6aff;
    --accent2: #a78bfa;
    --text: #f0f0f0;
    --text2: #888;
    --text3: #555;
    --green: #4ade80;
    --red: #f87171;
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

  /* ── Auth screens ── */
  #auth-screen {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 30% 50%, #1a1040 0%, var(--bg) 60%);
  }
  .auth-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 24px; padding: 40px; width: 380px;
  }
  .auth-logo { font-size: 28px; font-weight: 600; margin-bottom: 6px; }
  .auth-logo span { color: var(--accent2); }
  .auth-sub { color: var(--text2); font-size: 14px; margin-bottom: 32px; }
  .auth-tabs { display: flex; gap: 4px; background: var(--surface2); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 24px; }
  .auth-tab { flex: 1; padding: 8px; border: none; background: none; color: var(--text2); border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; transition: all 0.2s; }
  .auth-tab.active { background: var(--surface3); color: var(--text); }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; font-weight: 500; letter-spacing: 0.05em; }
  .field input { width: 100%; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .field input:focus { border-color: var(--accent); }
  .btn-primary { width: 100%; padding: 13px; background: var(--accent); border: none; border-radius: var(--radius-sm); color: white; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  .btn-primary:hover { opacity: 0.85; }
  .auth-error { color: var(--red); font-size: 13px; margin-bottom: 12px; display: none; }

  /* ── App layout ── */
  #app { display: none; height: 100vh; flex-direction: column; }
  .app-body { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar { width: 300px; min-width: 300px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar-header { padding: 20px 16px 12px; display: flex; align-items: center; justify-content: space-between; }
  .app-title { font-size: 20px; font-weight: 600; }
  .app-title span { color: var(--accent2); }
  .icon-btn { background: none; border: none; color: var(--text2); cursor: pointer; padding: 8px; border-radius: 50%; transition: all 0.2s; font-size: 18px; line-height: 1; }
  .icon-btn:hover { background: var(--surface2); color: var(--text); }
  .search-box { margin: 0 12px 12px; position: relative; }
  .search-box input { width: 100%; padding: 10px 14px 10px 38px; background: var(--surface2); border: 1px solid var(--border); border-radius: 50px; color: var(--text); font-family: inherit; font-size: 13px; outline: none; }
  .search-box input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 14px; }
  .search-results { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); margin: 0 12px 8px; display: none; }
  .search-result-item { padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.15s; }
  .search-result-item:hover { background: var(--surface3); }
  .contacts-list { flex: 1; overflow-y: auto; }
  .contact-item { padding: 12px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: background 0.15s; position: relative; }
  .contact-item:hover, .contact-item.active { background: var(--surface2); }
  .contact-item.active { border-left: 3px solid var(--accent); }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px; color: var(--accent2); flex-shrink: 0; position: relative; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.sm { width: 32px; height: 32px; font-size: 12px; }
  .online-dot { width: 10px; height: 10px; background: var(--green); border-radius: 50%; position: absolute; bottom: 1px; right: 1px; border: 2px solid var(--surface); }
  .contact-info { flex: 1; min-width: 0; }
  .contact-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contact-preview { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contact-meta { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .contact-time { font-size: 11px; color: var(--text3); }
  .unread-badge { background: var(--accent); color: white; border-radius: 50px; font-size: 10px; font-weight: 600; padding: 1px 6px; min-width: 18px; text-align: center; }
  .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .sidebar-footer:hover { background: var(--surface2); }
  .my-name { font-size: 13px; font-weight: 500; flex: 1; }
  .my-status { font-size: 11px; color: var(--text2); }

  /* ── Chat area ── */
  .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
  .chat-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text3); gap: 12px; }
  .chat-empty-icon { font-size: 48px; }
  .chat-empty p { font-size: 15px; }
  .chat-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--surface); }
  .chat-header-info { flex: 1; }
  .chat-header-name { font-size: 15px; font-weight: 600; }
  .chat-header-status { font-size: 12px; color: var(--text2); }
  .call-btns { display: flex; gap: 8px; }
  .call-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text2); font-size: 16px; transition: all 0.2s; }
  .call-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
  .messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 4px; }
  .msg-group { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
  .msg-row { display: flex; align-items: flex-end; gap: 8px; }
  .msg-row.mine { flex-direction: row-reverse; }
  .bubble { max-width: 68%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.5; position: relative; word-break: break-word; }
  .bubble.theirs { background: var(--surface2); border-bottom-left-radius: 4px; color: var(--text); }
  .bubble.mine { background: var(--accent); border-bottom-right-radius: 4px; color: white; }
  .bubble.deleted { opacity: 0.5; font-style: italic; color: var(--text2); }
  .bubble-time { font-size: 10px; opacity: 0.6; margin-top: 4px; display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
  .ticks { font-size: 12px; }
  .ticks.read { color: #60a5fa; }
  .reply-preview { background: rgba(255,255,255,0.1); border-left: 3px solid rgba(255,255,255,0.4); padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 12px; opacity: 0.8; }
  .file-attachment { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(255,255,255,0.08); border-radius: 10px; margin-bottom: 4px; cursor: pointer; text-decoration: none; color: inherit; }
  .file-icon { font-size: 22px; }
  .file-name { font-size: 13px; font-weight: 500; }
  .file-size { font-size: 11px; opacity: 0.6; }
  .img-attachment { max-width: 240px; border-radius: 12px; cursor: pointer; }
  .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 10px 14px; }
  .typing-dot { width: 7px; height: 7px; background: var(--text3); border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
  .date-divider { text-align: center; font-size: 11px; color: var(--text3); margin: 12px 0; }
  .date-divider span { background: var(--surface2); padding: 4px 12px; border-radius: 20px; }

  /* ── Message input ── */
  .input-area { padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface); }
  .reply-bar { background: var(--surface2); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; display: none; font-size: 13px; align-items: center; gap: 8px; }
  .reply-bar span { flex: 1; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reply-cancel { cursor: pointer; color: var(--text3); font-size: 16px; }
  .input-row { display: flex; align-items: flex-end; gap: 8px; }
  .input-attach { display: none; }
  .attach-btn, .send-btn, .voice-btn { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 50%; font-size: 18px; transition: all 0.2s; line-height: 1; }
  .attach-btn { color: var(--text2); }
  .attach-btn:hover { color: var(--text); background: var(--surface2); }
  .msg-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 50px; padding: 10px 18px; color: var(--text); font-family: inherit; font-size: 14px; outline: none; resize: none; max-height: 120px; line-height: 1.5; }
  .msg-input:focus { border-color: var(--accent); }
  .send-btn { background: var(--accent); color: white; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .send-btn:hover { opacity: 0.85; }
  .voice-btn { color: var(--text2); font-size: 20px; }
  .voice-btn:hover { color: var(--red); }
  .voice-btn.recording { color: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  /* ── Context menu ── */
  .context-menu { position: fixed; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px; z-index: 1000; min-width: 140px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: none; }
  .context-item { padding: 8px 12px; cursor: pointer; font-size: 13px; border-radius: 6px; display: flex; align-items: center; gap: 8px; color: var(--text); }
  .context-item:hover { background: var(--surface3); }
  .context-item.danger { color: var(--red); }

  /* ── Call overlay ── */
  #call-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
  .call-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 600; color: var(--accent2); animation: callPulse 2s infinite; }
  @keyframes callPulse { 0%,100%{box-shadow:0 0 0 0 rgba(124,106,255,0.4)} 50%{box-shadow:0 0 0 20px rgba(124,106,255,0)} }
  .call-name { font-size: 22px; font-weight: 600; }
  .call-status { font-size: 14px; color: var(--text2); }
  .call-actions { display: flex; gap: 20px; margin-top: 20px; }
  .call-action-btn { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; font-size: 22px; display: flex; align-items: center; justify-content: center; }
  .call-action-btn.end { background: var(--red); color: white; }
  .call-action-btn.answer { background: var(--green); color: white; }
  .call-action-btn.toggle { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  #local-video, #remote-video { border-radius: 16px; background: var(--surface2); }
  #remote-video { width: 360px; height: 240px; }
  #local-video { width: 120px; height: 90px; position: absolute; bottom: 120px; right: 20px; }

  /* ── Profile drawer ── */
  #profile-drawer { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1500; display: none; align-items: center; justify-content: center; }
  .profile-box { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 32px; width: 340px; text-align: center; }
  .profile-box .avatar { width: 80px; height: 80px; font-size: 28px; margin: 0 auto 16px; }
  .profile-name-input { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 16px; font-weight: 600; padding: 8px 14px; width: 100%; text-align: center; margin-bottom: 8px; outline: none; }
  .profile-status-input { background: none; border: none; border-bottom: 1px solid var(--border); color: var(--text2); font-family: inherit; font-size: 13px; padding: 6px; width: 100%; text-align: center; margin-bottom: 20px; outline: none; }
  .profile-avatar-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text2); font-family: inherit; font-size: 13px; padding: 8px 16px; cursor: pointer; margin-bottom: 16px; }
  .profile-save { background: var(--accent); border: none; border-radius: 10px; color: white; font-family: inherit; font-size: 14px; font-weight: 600; padding: 10px 24px; cursor: pointer; }
  .profile-close { background: none; border: none; color: var(--text3); font-family: inherit; font-size: 13px; cursor: pointer; margin-top: 10px; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── Misc ── */
  .hidden { display: none !important; }
  .empty-chat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text3); gap: 8px; }
</style>
</head>
<body>

<!-- ── Auth Screen ── -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">You<span>&</span>Me</div>
    <div class="auth-sub">Private 1-to-1 messaging</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="showTab('login')">Log in</button>
      <button class="auth-tab" onclick="showTab('register')">Sign up</button>
    </div>
    <div id="auth-error" class="auth-error"></div>
    <div id="login-form">
      <div class="field"><label>EMAIL</label><input type="email" id="login-email" placeholder="you@example.com"></div>
      <div class="field"><label>PASSWORD</label><input type="password" id="login-password" placeholder="••••••••"></div>
      <button class="btn-primary" onclick="login()">Log in</button>
    </div>
    <div id="register-form" class="hidden">
      <div class="field"><label>YOUR NAME</label><input type="text" id="reg-name" placeholder="Alex"></div>
      <div class="field"><label>EMAIL</label><input type="email" id="reg-email" placeholder="you@example.com"></div>
      <div class="field"><label>PASSWORD</label><input type="password" id="reg-password" placeholder="At least 8 characters"></div>
      <button class="btn-primary" onclick="register()">Create account</button>
    </div>
  </div>
</div>

<!-- ── Main App ── -->
<div id="app">
  <div class="app-body">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="app-title">You<span>&</span>Me</div>
        <button class="icon-btn" title="New chat" onclick="document.getElementById('search-input').focus()">✏️</button>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search or start new chat" oninput="onSearch(this.value)">
      </div>
      <div class="search-results" id="search-results"></div>
      <div class="contacts-list" id="contacts-list">
        <div class="empty-chat" style="padding:40px 20px; text-align:center">
          <div style="font-size:32px">💬</div>
          <p style="font-size:13px">Search for someone to start chatting</p>
        </div>
      </div>
      <div class="sidebar-footer" onclick="openProfile()">
        <div class="avatar sm" id="my-avatar-sidebar">?</div>
        <div>
          <div class="my-name" id="my-name-sidebar">Loading...</div>
          <div class="my-status" id="my-status-sidebar">Tap to edit profile</div>
        </div>
      </div>
    </div>

    <!-- Chat area -->
    <div class="chat-area">
      <div id="chat-empty" class="chat-empty">
        <div class="chat-empty-icon">💬</div>
        <p>Select a chat to start messaging</p>
      </div>
      <div id="chat-view" class="hidden" style="display:flex;flex-direction:column;height:100%">
        <div class="chat-header">
          <div class="avatar" id="chat-avatar">?</div>
          <div class="chat-header-info">
            <div class="chat-header-name" id="chat-name">Name</div>
            <div class="chat-header-status" id="chat-status">Offline</div>
          </div>
          <div class="call-btns">
            <div class="call-btn" title="Voice call" onclick="startCall('audio')">📞</div>
            <div class="call-btn" title="Video call" onclick="startCall('video')">📹</div>
          </div>
        </div>
        <div class="messages-area" id="messages-area"></div>
        <div id="typing-row" class="hidden" style="padding:0 20px 4px;display:flex;align-items:center;gap:8px">
          <div class="bubble theirs" style="padding:8px 14px">
            <div class="typing-indicator">
              <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
            </div>
          </div>
        </div>
        <div class="input-area">
          <div class="reply-bar" id="reply-bar">
            <span id="reply-text"></span>
            <span class="reply-cancel" onclick="cancelReply()">✕</span>
          </div>
          <div class="input-row">
            <label class="attach-btn" title="Attach file">📎<input type="file" class="input-attach" id="file-input" onchange="attachFile(this)"></label>
            <textarea class="msg-input" id="msg-input" placeholder="Message" rows="1"
              oninput="autoResize(this); sendTyping(true)"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"
              onblur="sendTyping(false)"></textarea>
            <button class="send-btn" onclick="sendMessage()">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Context menu -->
<div class="context-menu" id="context-menu">
  <div class="context-item" id="ctx-reply" onclick="replyToMsg()">↩ Reply</div>
  <div class="context-item" id="ctx-edit" onclick="editMsg()">✏️ Edit</div>
  <div class="context-item danger" id="ctx-delete" onclick="deleteMsg()">🗑 Delete</div>
</div>

<!-- Call overlay -->
<div id="call-overlay">
  <div class="call-avatar" id="call-avatar-display">?</div>
  <div class="call-name" id="call-name-display"></div>
  <div class="call-status" id="call-status-display">Calling...</div>
  <div style="position:relative">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted></video>
  </div>
  <div class="call-actions" id="call-actions-incoming" style="display:none">
    <button class="call-action-btn answer" onclick="answerCall()">📞</button>
    <button class="call-action-btn end" onclick="rejectCall()">📵</button>
  </div>
  <div class="call-actions" id="call-actions-active" style="display:none">
    <button class="call-action-btn toggle" id="mute-btn" onclick="toggleMute()">🎙️</button>
    <button class="call-action-btn toggle" id="cam-btn" onclick="toggleCamera()">📹</button>
    <button class="call-action-btn end" onclick="endCall()">📵</button>
  </div>
</div>

<!-- Profile drawer -->
<div id="profile-drawer">
  <div class="profile-box">
    <div class="avatar profile-box-avatar" id="profile-avatar-display" style="width:80px;height:80px;font-size:28px;margin:0 auto 16px"></div>
    <input class="profile-name-input" id="profile-name-input" type="text" placeholder="Your name">
    <input class="profile-status-input" id="profile-status-input" type="text" placeholder="Hey, I'm using YouAndMe!">
    <br>
    <label class="profile-avatar-btn">📷 Change photo<input type="file" accept="image/*" style="display:none" onchange="uploadAvatar(this)"></label>
    <br>
    <button class="profile-save" onclick="saveProfile()">Save</button>
    <br>
    <button class="profile-close" onclick="closeProfile()">Close</button>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const API = window.location.hostname === 'localhost'
  ? 'http://localhost:4000'
  : ''; // Same origin when deployed

// ── State ─────────────────────────────────────────────────────────────────────
let token = localStorage.getItem('yam_token');
let me = null;
let socket = null;
let activeUserId = null;
let activeUser = null;
let conversations = {}; // { userId: [messages] }
let unread = {};        // { userId: count }
let contacts = {};      // { userId: user }
let replyingTo = null;
let editingMsgId = null;
let contextMsgId = null;
let contextMsgOwn = false;
let peerConn = null;
let localStream = null;
let callType = 'audio';
let isMuted = false;
let isCamOff = false;
let typingTimer = null;

// ── Init ──────────────────────────────────────────────────────────────────────
if (token) initApp();

async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

// ── Auth ──────────────────────────────────────────────────────────────────────
function showTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
  document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
  document.getElementById('auth-error').style.display = 'none';
}

async function login() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  try {
    const data = await fetch(API + '/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email,password}) });
    const json = await data.json();
    if (!data.ok) throw new Error(json.error);
    token = json.token; me = json.user;
    localStorage.setItem('yam_token', token);
    initApp();
  } catch(e) { showError(e.message); }
}

async function register() {
  const name = document.getElementById('reg-name').value;
  const email = document.getElementById('reg-email').value;
  const password = document.getElementById('reg-password').value;
  try {
    const data = await fetch(API + '/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name,email,password}) });
    const json = await data.json();
    if (!data.ok) throw new Error(json.error);
    token = json.token; me = json.user;
    localStorage.setItem('yam_token', token);
    initApp();
  } catch(e) { showError(e.message); }
}

function showError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg; el.style.display = 'block';
}

// ── App Init ──────────────────────────────────────────────────────────────────
async function initApp() {
  try {
    me = await api('/api/me');
  } catch {
    localStorage.removeItem('yam_token');
    return;
  }
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  updateSidebarMe();
  connectSocket();
}

function updateSidebarMe() {
  const av = document.getElementById('my-avatar-sidebar');
  if (me.avatar) { av.innerHTML = `<img src="${API+me.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`; }
  else { av.textContent = me.name[0].toUpperCase(); }
  document.getElementById('my-name-sidebar').textContent = me.name;
  document.getElementById('my-status-sidebar').textContent = me.status || 'Tap to edit profile';
}

// ── Socket ────────────────────────────────────────────────────────────────────
function connectSocket() {
  socket = io(API, { auth: { token } });

  socket.on('new_message', (msg) => {
    if (!conversations[msg.fromUserId]) conversations[msg.fromUserId] = [];
    conversations[msg.fromUserId].push(msg);
    if (activeUserId === msg.fromUserId) {
      appendMessage(msg);
      socket.emit('mark_read', { fromUserId: msg.fromUserId });
      scrollBottom();
    } else {
      unread[msg.fromUserId] = (unread[msg.fromUserId] || 0) + 1;
    }
    upsertContact(msg.fromUserId, msg);
  });

  socket.on('message_sent', (msg) => {
    if (!conversations[msg.toUserId]) conversations[msg.toUserId] = [];
    conversations[msg.toUserId].push(msg);
    if (activeUserId === msg.toUserId) { appendMessage(msg); scrollBottom(); }
    upsertContact(msg.toUserId, msg);
  });

  socket.on('message_delivered', ({ messageId }) => updateTick(messageId, 'delivered'));
  socket.on('messages_read', () => {
    if (activeUserId) {
      (conversations[activeUserId]||[]).forEach(m => { if(m.fromUserId===me.id) m.read=true; });
      renderMessages();
    }
  });

  socket.on('message_edited', (msg) => {
    updateMsgInStore(msg);
    if (activeUserId === msg.fromUserId || activeUserId === msg.toUserId) renderMessages();
  });

  socket.on('message_deleted', ({ messageId }) => {
    deleteMsgInStore(messageId);
    if (activeUserId) renderMessages();
  });

  socket.on('user_typing', ({ fromUserId, isTyping }) => {
    if (activeUserId === fromUserId) {
      document.getElementById('typing-row').classList.toggle('hidden', !isTyping);
    }
  });

  socket.on('user_online', ({ userId, isOnline, lastSeen }) => {
    if (contacts[userId]) contacts[userId].isOnline = isOnline;
    if (activeUserId === userId) updateChatStatus(isOnline, lastSeen);
    renderContactList();
  });

  socket.on('user_updated', (user) => {
    if (contacts[user.id]) contacts[user.id] = { ...contacts[user.id], ...user };
    renderContactList();
  });

  socket.on('incoming_call', ({ fromUserId, fromName, offer, callType: ct }) => {
    callType = ct;
    showIncomingCall(fromUserId, fromName, offer);
  });

  socket.on('call_answered', async ({ answer }) => {
    await peerConn.setRemoteDescription(new RTCSessionDescription(answer));
    document.getElementById('call-status-display').textContent = 'Connected';
    document.getElementById('call-actions-incoming').style.display = 'none';
    document.getElementById('call-actions-active').style.display = 'flex';
  });

  socket.on('call_rejected', () => {
    document.getElementById('call-status-display').textContent = 'Call declined';
    setTimeout(closeCall, 2000);
  });

  socket.on('call_ended', () => {
    document.getElementById('call-status-display').textContent = 'Call ended';
    setTimeout(closeCall, 1500);
  });

  socket.on('ice_candidate', async ({ candidate }) => {
    if (peerConn && candidate) await peerConn.addIceCandidate(new RTCIceCandidate(candidate));
  });

  socket.on('call_failed', ({ reason }) => {
    document.getElementById('call-status-display').textContent = reason;
    setTimeout(closeCall, 2000);
  });
}

// ── Contacts & Search ─────────────────────────────────────────────────────────
async function onSearch(q) {
  const results = document.getElementById('search-results');
  if (!q.trim()) { results.style.display='none'; return; }
  const users = await api(`/api/users/search?q=${encodeURIComponent(q)}`);
  if (!users.length) { results.style.display='none'; return; }
  results.style.display = 'block';
  results.innerHTML = users.map(u => `
    <div class="search-result-item" onclick="openChat('${u.id}')">
      <div class="avatar sm">${u.avatar ? `<img src="${API+u.avatar}">` : u.name[0].toUpperCase()}</div>
      <div><div style="font-size:13px;font-weight:500">${u.name}</div><div style="font-size:11px;color:var(--text2)">${u.email}</div></div>
    </div>`).join('');
}

function upsertContact(userId, lastMsg) {
  if (!contacts[userId]) {
    api(`/api/users/${userId}`).then(u => {
      contacts[userId] = u;
      renderContactList();
    });
  }
  renderContactList();
}

function renderContactList() {
  const list = document.getElementById('contacts-list');
  const cids = Object.keys(contacts);
  if (!cids.length) {
    list.innerHTML = `<div class="empty-chat" style="padding:40px 20px;text-align:center"><div style="font-size:32px">💬</div><p style="font-size:13px">Search for someone to start chatting</p></div>`;
    return;
  }
  list.innerHTML = cids.map(uid => {
    const u = contacts[uid];
    const msgs = conversations[uid] || [];
    const last = msgs[msgs.length - 1];
    const preview = last ? (last.deleted ? 'Message deleted' : last.file ? '📎 File' : last.text) : '';
    const count = unread[uid] || 0;
    const av = u.avatar ? `<img src="${API+u.avatar}">` : u.name[0].toUpperCase();
    return `
    <div class="contact-item ${activeUserId===uid?'active':''}" onclick="openChat('${uid}')">
      <div class="avatar">${av}${u.isOnline?'<div class="online-dot"></div>':''}</div>
      <div class="contact-info">
        <div class="contact-name">${u.name}</div>
        <div class="contact-preview">${preview}</div>
      </div>
      <div class="contact-meta">
        ${last ? `<div class="contact-time">${formatTime(last.createdAt)}</div>` : ''}
        ${count ? `<div class="unread-badge">${count}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ── Open chat ─────────────────────────────────────────────────────────────────
async function openChat(userId) {
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').style.display = 'none';

  activeUserId = userId;
  unread[userId] = 0;

  if (!contacts[userId]) contacts[userId] = await api(`/api/users/${userId}`);
  activeUser = contacts[userId];

  document.getElementById('chat-empty').classList.add('hidden');
  const cv = document.getElementById('chat-view');
  cv.classList.remove('hidden');
  cv.style.display = 'flex';

  const av = document.getElementById('chat-avatar');
  av.innerHTML = activeUser.avatar ? `<img src="${API+activeUser.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : activeUser.name[0].toUpperCase();
  document.getElementById('chat-name').textContent = activeUser.name;
  updateChatStatus(activeUser.isOnline, activeUser.lastSeen);

  if (!conversations[userId]) {
    conversations[userId] = await api(`/api/messages/${userId}`);
  }

  renderMessages();
  scrollBottom();
  socket.emit('mark_read', { fromUserId: userId });
  renderContactList();
}

function updateChatStatus(isOnline, lastSeen) {
  const el = document.getElementById('chat-status');
  el.textContent = isOnline ? 'Online' : lastSeen ? `Last seen ${timeAgo(lastSeen)}` : 'Offline';
  el.style.color = isOnline ? 'var(--green)' : 'var(--text2)';
}

// ── Messages ──────────────────────────────────────────────────────────────────
function renderMessages() {
  const area = document.getElementById('messages-area');
  const msgs = conversations[activeUserId] || [];
  area.innerHTML = msgs.map((m, i) => {
    const mine = m.fromUserId === me.id;
    const prev = msgs[i-1];
    const showDate = !prev || !sameDay(m.createdAt, prev.createdAt);
    return `
      ${showDate ? `<div class="date-divider"><span>${formatDate(m.createdAt)}</span></div>` : ''}
      <div class="msg-row ${mine?'mine':''}" data-id="${m.id}" oncontextmenu="showContext(event,'${m.id}',${mine})">
        ${renderBubble(m, mine)}
      </div>`;
  }).join('');
}

function renderBubble(m, mine) {
  if (m.deleted) return `<div class="bubble ${mine?'mine':'theirs'} deleted">🚫 Message deleted</div>`;
  let inner = '';
  if (m.replyTo) {
    const orig = findMsg(m.replyTo);
    if (orig) inner += `<div class="reply-preview">${orig.text || '📎 File'}</div>`;
  }
  if (m.file) {
    if (m.file.type && m.file.type.startsWith('image/')) {
      inner += `<img class="img-attachment" src="${API+m.file.url}" onclick="window.open('${API+m.file.url}')">`;
    } else {
      inner += `<a class="file-attachment" href="${API+m.file.url}" download="${m.file.name}" target="_blank">
        <div class="file-icon">📄</div>
        <div><div class="file-name">${m.file.name}</div><div class="file-size">${formatSize(m.file.size)}</div></div>
      </a>`;
    }
  }
  if (m.text) inner += `<div>${m.text}${m.edited?'<span style="font-size:10px;opacity:0.5"> (edited)</span>':''}</div>`;
  const ticks = mine ? `<span class="ticks ${m.read?'read':''}">` + (m.read ? '✓✓' : m.delivered ? '✓✓' : '✓') + `</span>` : '';
  inner += `<div class="bubble-time">${formatTime(m.createdAt)}${ticks}</div>`;
  return `<div class="bubble ${mine?'mine':'theirs'}">${inner}</div>`;
}

function appendMessage(msg) {
  const area = document.getElementById('messages-area');
  const mine = msg.fromUserId === me.id;
  const div = document.createElement('div');
  div.className = `msg-row ${mine?'mine':''}`;
  div.dataset.id = msg.id;
  div.setAttribute('oncontextmenu', `showContext(event,'${msg.id}',${mine})`);
  div.innerHTML = renderBubble(msg, mine);
  area.appendChild(div);
}

function updateTick(messageId, state) {
  if (!activeUserId) return;
  const msgs = conversations[activeUserId] || [];
  const m = msgs.find(x => x.id === messageId);
  if (m) { m[state] = true; renderMessages(); }
}

function updateMsgInStore(msg) {
  const cid = msg.fromUserId === me.id ? msg.toUserId : msg.fromUserId;
  const msgs = conversations[cid] || [];
  const i = msgs.findIndex(m => m.id === msg.id);
  if (i !== -1) msgs[i] = msg;
}

function deleteMsgInStore(messageId) {
  Object.values(conversations).forEach(msgs => {
    const m = msgs.find(x => x.id === messageId);
    if (m) { m.deleted = true; m.text = ''; m.file = null; }
  });
}

function findMsg(id) {
  return (conversations[activeUserId]||[]).find(m => m.id === id);
}

// ── Send message ──────────────────────────────────────────────────────────────
function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text && !editingMsgId) return;
  if (!activeUserId) return;

  if (editingMsgId) {
    socket.emit('edit_message', { messageId: editingMsgId, toUserId: activeUserId, newText: text });
    editingMsgId = null;
    input.value = '';
    input.style.height = '';
    document.getElementById('reply-bar').style.display = 'none';
    return;
  }

  socket.emit('send_message', { toUserId: activeUserId, text, replyTo: replyingTo?.id || null });
  input.value = '';
  input.style.height = '';
  cancelReply();
  sendTyping(false);
}

async function attachFile(input) {
  if (!input.files[0] || !activeUserId) return;
  const form = new FormData();
  form.append('file', input.files[0]);
  const res = await fetch(API + '/api/upload', { method:'POST', headers:{ Authorization:`Bearer ${token}` }, body: form });
  const file = await res.json();
  socket.emit('send_message', { toUserId: activeUserId, text: '', file });
  input.value = '';
}

function sendTyping(isTyping) {
  if (!activeUserId) return;
  clearTimeout(typingTimer);
  socket.emit('typing', { toUserId: activeUserId, isTyping });
  if (isTyping) typingTimer = setTimeout(() => sendTyping(false), 3000);
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── Context menu & actions ────────────────────────────────────────────────────
function showContext(e, msgId, isOwn) {
  e.preventDefault();
  contextMsgId = msgId;
  contextMsgOwn = isOwn;
  const menu = document.getElementById('context-menu');
  document.getElementById('ctx-edit').style.display = isOwn ? 'flex' : 'none';
  document.getElementById('ctx-delete').style.display = isOwn ? 'flex' : 'none';
  menu.style.left = Math.min(e.clientX, window.innerWidth-160) + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight-120) + 'px';
  menu.style.display = 'block';
}

document.addEventListener('click', () => document.getElementById('context-menu').style.display = 'none');

function replyToMsg() {
  const msg = findMsg(contextMsgId);
  if (!msg) return;
  replyingTo = msg;
  const bar = document.getElementById('reply-bar');
  bar.style.display = 'flex';
  document.getElementById('reply-text').textContent = msg.text || '📎 File';
  document.getElementById('msg-input').focus();
}

function cancelReply() {
  replyingTo = null;
  document.getElementById('reply-bar').style.display = 'none';
}

function editMsg() {
  const msg = findMsg(contextMsgId);
  if (!msg || !msg.text) return;
  editingMsgId = msg.id;
  const input = document.getElementById('msg-input');
  input.value = msg.text;
  const bar = document.getElementById('reply-bar');
  bar.style.display = 'flex';
  document.getElementById('reply-text').textContent = '✏️ Editing message';
  input.focus();
}

function deleteMsg() {
  if (!contextMsgId) return;
  socket.emit('delete_message', { messageId: contextMsgId, toUserId: activeUserId });
}

// ── Calls (WebRTC) ────────────────────────────────────────────────────────────
async function startCall(type) {
  if (!activeUserId) return;
  callType = type;
  await setupPeer();
  const offer = await peerConn.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: type==='video' });
  await peerConn.setLocalDescription(offer);
  socket.emit('call_user', { toUserId: activeUserId, offer, callType: type });
  showCallOverlay(activeUser.name, 'Calling...');
  document.getElementById('call-actions-active').style.display = 'flex';
}

async function showIncomingCall(fromUserId, fromName, offer) {
  callType = callType;
  await setupPeer();
  await peerConn.setRemoteDescription(new RTCSessionDescription(offer));
  showCallOverlay(fromName, 'Incoming call...');
  document.getElementById('call-actions-incoming').style.display = 'flex';
  window._incomingFrom = fromUserId;
  window._incomingOffer = offer;
}

async function answerCall() {
  const answer = await peerConn.createAnswer();
  await peerConn.setLocalDescription(answer);
  socket.emit('call_answer', { toUserId: window._incomingFrom, answer });
  document.getElementById('call-actions-incoming').style.display = 'none';
  document.getElementById('call-actions-active').style.display = 'flex';
  document.getElementById('call-status-display').textContent = 'Connected';
}

function rejectCall() {
  socket.emit('call_rejected', { toUserId: window._incomingFrom });
  closeCall();
}

function endCall() {
  socket.emit('call_ended', { toUserId: activeUserId || window._incomingFrom });
  closeCall();
}

async function setupPeer() {
  if (peerConn) peerConn.close();
  peerConn = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: callType === 'video' });
    localStream.getTracks().forEach(t => peerConn.addTrack(t, localStream));
    if (callType === 'video') document.getElementById('local-video').srcObject = localStream;
  } catch(e) { console.log('Media error:', e); }
  peerConn.ontrack = (e) => { document.getElementById('remote-video').srcObject = e.streams[0]; };
  peerConn.onicecandidate = (e) => {
    if (e.candidate) socket.emit('ice_candidate', { toUserId: activeUserId || window._incomingFrom, candidate: e.candidate });
  };
}

function showCallOverlay(name, status) {
  document.getElementById('call-overlay').style.display = 'flex';
  document.getElementById('call-name-display').textContent = name;
  document.getElementById('call-status-display').textContent = status;
  document.getElementById('call-avatar-display').textContent = name[0].toUpperCase();
  document.getElementById('remote-video').style.display = callType === 'video' ? 'block' : 'none';
  document.getElementById('local-video').style.display = callType === 'video' ? 'block' : 'none';
}

function closeCall() {
  document.getElementById('call-overlay').style.display = 'none';
  document.getElementById('call-actions-incoming').style.display = 'none';
  document.getElementById('call-actions-active').style.display = 'none';
  if (peerConn) { peerConn.close(); peerConn = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  document.getElementById('local-video').srcObject = null;
  document.getElementById('remote-video').srcObject = null;
}

function toggleMute() {
  isMuted = !isMuted;
  localStream?.getAudioTracks().forEach(t => t.enabled = !isMuted);
  document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🎙️';
}

function toggleCamera() {
  isCamOff = !isCamOff;
  localStream?.getVideoTracks().forEach(t => t.enabled = !isCamOff);
  document.getElementById('cam-btn').textContent = isCamOff ? '🚫' : '📹';
}

// ── Profile ───────────────────────────────────────────────────────────────────
function openProfile() {
  document.getElementById('profile-drawer').style.display = 'flex';
  document.getElementById('profile-name-input').value = me.name;
  document.getElementById('profile-status-input').value = me.status || '';

function closeProfile() { document.getElementById('profile-drawer').style.display = 'none'; }

async function saveProfile() {
  const name = document.getElementById('profile-name-input').value.trim();
  const status = document.getElementById('profile-status-input').value.trim();
  me = await api('/api/me', 'PUT', { name, status });

async function uploadAvatar(input) {
  const form = new FormData();
  form.append('avatar', input.files[0]);
  const res = await fetch(API + '/api/me/avatar', { method:'POST', headers:{ Authorization:`Bearer ${token}` }, body: form });
  me = await res.json();
  updateSidebarMe();
  const av = document.getElementById('profile-avatar-display');
  av.innerHTML = `<img src="${API+me.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function scrollBottom() {
  const a = document.getElementById('messages-area');
  setTimeout(() => a.scrollTop = a.scrollHeight, 50);
}

function formatTime(d) {
  return new Date(d).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}

function formatDate(d) {
  const date = new Date(d);
  const today = new Date();
  if (sameDay(d, today)) return 'Today';
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  if (sameDay(d, yest)) return 'Yesterday';
  return date.toLocaleDateString([], { weekday:'long', month:'short', day:'numeric' });
}

function sameDay(a, b) {
  const da = new Date(a), db = new Date(b);
  return da.getFullYear()===db.getFullYear() && da.getMonth()===db.getMonth() && da.getDate()===db.getDate();
}

function timeAgo(d) {
  const s = Math.floor((Date.now() - new Date(d)) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}
